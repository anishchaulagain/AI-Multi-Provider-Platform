[project]
name = "platform-rag"
version = "0.1.0"
description = "RAG building blocks: Qdrant chunk store (base) and the ingestion pipeline ([ingest] extra)"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.12",
    "pydantic>=2.8",
    "structlog>=26.1.0",
    "llm-client",
]

[project.optional-dependencies]
# Heavy parsing/chunking deps, only needed by the ingestion worker.
ingest = [
    "llama-index-core>=0.12",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "py-rust-stemmers>=0.1.3",
    "mmh3>=4.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
llm-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires running infrastructure"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
