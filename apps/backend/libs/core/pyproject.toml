[project]
name = "platform-core"
version = "0.1.0"
description = "Shared settings, logging, errors, middleware and rate limiting"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "structlog>=26.1.0",
    "redis>=5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
