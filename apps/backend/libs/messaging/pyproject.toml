[project]
name = "platform-messaging"
version = "0.1.0"
description = "RabbitMQ topology, publisher and retrying consumer; job contracts; Redis status events"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.0",
    "pydantic>=2.8",
    "redis>=5",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires running infrastructure"]
