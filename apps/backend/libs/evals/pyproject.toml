[project]
name = "platform-evals"
version = "0.1.0"
description = "Answer and retrieval evaluation: LLM-judge metrics, sample loading, offline runner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uuid6>=2024.7",
    "llm-client",
    "platform-db",
    "platform-rag",
]

[project.scripts]
platform-eval = "platform_evals.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
llm-client = { workspace = true }
platform-db = { workspace = true }
platform-rag = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
