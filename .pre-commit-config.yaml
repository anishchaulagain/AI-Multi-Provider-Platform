repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd apps/backend && uv run ruff check --fix .'
        language: system
        files: ^apps/backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd apps/backend && uv run ruff format .'
        language: system
        files: ^apps/backend/.*\.py$
        pass_filenames: false

      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd apps/frontend && npm run lint'
        language: system
        files: ^apps/frontend/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
