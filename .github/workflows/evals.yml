name: Evals

# Offline quality gate: runs the golden dataset through the real stack with free-tier
# LLMs and fails when a score drops below evals/thresholds.yaml.
#
# Needs at least one provider key as a repository secret (GROQ_API_KEY, GEMINI_API_KEY,
# OPENROUTER_API_KEY, NVIDIA_API_KEY) and, for embeddings, NVIDIA_API_KEY or
# GEMINI_API_KEY. Without them (e.g. PRs from forks) the job is skipped with a notice.

on:
  pull_request:
    paths:
      - "apps/backend/libs/rag/**"
      - "apps/backend/libs/history/**"
      - "apps/backend/libs/evals/**"
      - "apps/backend/services/api/src/platform_api/services/chat.py"
      - "infra/gateway/routes.yaml"
      - "infra/litellm/config.yaml"
      - "evals/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "answers, history or all"
        default: answers

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: platform
          RABBITMQ_DEFAULT_PASS: platform
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/platform-neo4j
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      LITELLM_MASTER_KEY: sk-ci
      GATEWAY_SERVICE_TOKEN: ci-gateway-token
      JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long!!
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://platform:platform@localhost:5432/platform
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://platform:platform@localhost:5672/
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: platform-neo4j
      GATEWAY_URL: http://localhost:8100
      LITELLM_URL: http://localhost:4000
      ROUTES_FILE: ../../infra/gateway/routes.yaml
      # The offline run judges every answer itself; no online sampling needed.
      EVAL_SAMPLE_RATE: "0"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Check provider keys
        id: keys
        run: |
          if [ -n "$NVIDIA_API_KEY" ]; then
            {
              echo "EMBED_ALIAS=embed-nvidia"
              echo "EMBED_MODEL_NAME=nemotron-3.5-embed-1b"
              echo "EMBED_DOCUMENT_INPUT_TYPE=passage"
              echo "EMBED_QUERY_INPUT_TYPE=query"
            } >> "$GITHUB_ENV"
          elif [ -n "$GEMINI_API_KEY" ]; then
            {
              echo "EMBED_ALIAS=embed-gemini"
              echo "EMBED_MODEL_NAME=gemini-embedding-001"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::Evals skipped: set NVIDIA_API_KEY or GEMINI_API_KEY (embeddings) as repository secrets."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'EMBED_DOCUMENT_PREFIX=\nEMBED_QUERY_PREFIX=\n' >> "$GITHUB_ENV"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6
        if: steps.keys.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install, migrate, seed
        if: steps.keys.outputs.run == 'true'
        run: |
          uv sync --all-packages --locked
          uv run alembic -c libs/db/alembic.ini upgrade head
          uv run python -m platform_api.cli.seed

      - name: Start LiteLLM, gateway, API and ingestion worker
        if: steps.keys.outputs.run == 'true'
        run: |
          mkdir -p /tmp/logs
          (cd ../.. && env -u DATABASE_URL nohup uvx --python 3.12 --from "litellm[proxy]" \
            litellm --config infra/litellm/config.yaml --port 4000 > /tmp/logs/litellm.log 2>&1 &)
          REDIS_URL=redis://localhost:6379/1 nohup uv run uvicorn gateway.main:app --port 8100 \
            > /tmp/logs/gateway.log 2>&1 &
          nohup uv run uvicorn platform_api.main:app --port 8000 > /tmp/logs/api.log 2>&1 &
          nohup uv run python -m ingestion_worker > /tmp/logs/worker.log 2>&1 &
          for url in http://localhost:4000/health/liveliness http://localhost:8100/healthz http://localhost:8000/readyz; do
            timeout 180 bash -c "until curl -sf $url > /dev/null; do sleep 2; done" \
              || { echo "::error::$url did not come up"; exit 1; }
          done

      - name: Run evals
        if: steps.keys.outputs.run == 'true'
        run: uv run python -m platform_evals.cli --suite "${{ inputs.suite || 'answers' }}"

      - name: Upload report
        if: always() && steps.keys.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            evals/reports/*.json
            /tmp/logs/*.log
          if-no-files-found: ignore
