name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql+asyncpg://platform:platform@localhost:5432/platform_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: |
          uv run mypy libs/core/src libs/db/src
          for m in libs/llm_client services/gateway services/api; do
            (cd $m && uv run mypy --config-file ../../pyproject.toml src tests)
          done

      - name: Migrations apply cleanly and match models
        env:
          DATABASE_URL: postgresql+asyncpg://platform:platform@localhost:5432/platform_test
        run: |
          uv run alembic -c libs/db/alembic.ini upgrade head
          uv run alembic -c libs/db/alembic.ini check

      - name: Tests
        run: |
          for m in libs/llm_client services/gateway services/api; do
            echo "== $m"
            (cd $m && uv run pytest -v)
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp docker/.env.example docker/.env
          docker compose -f docker/compose.yml -f docker/compose.ports.yml -f docker/compose.dev.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: docker/python.Dockerfile
          target: runtime
          build-args: |
            PACKAGE=platform-api
            APP_MODULE=platform_api.main:app
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: docker/python.Dockerfile
          target: runtime
          build-args: |
            PACKAGE=gateway
            APP_MODULE=gateway.main:app
            PORT=8100
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: docker/frontend.Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
