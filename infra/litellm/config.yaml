# Minimal LiteLLM config. App code should only reference the model_name aliases.
# Deployments sharing a model_name are load-balanced; fallbacks kick in on failure.

model_list:
  # ---- chat-fast ----
  - model_name: chat-fast
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: chat-fast-hosted
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  # ---- chat-smart ----
  - model_name: chat-smart
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: chat-smart-fallback
    litellm_params:
      model: openrouter/mistralai/mistral-7b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ---- embeddings ----
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
  fallbacks:
    - chat-fast: ["chat-fast-hosted"]
    - chat-smart: ["chat-smart-fallback", "chat-fast"]

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
