# LiteLLM is used purely as a provider adapter: one model_name per deployment.
# Routing, fallbacks, rate limits and circuit breaking live in the AI Gateway
# (infra/gateway/routes.yaml), so LiteLLM retries/fallbacks are disabled here.
#
# Free-tier model IDs change often. List what a key can use with:
#   Groq:       curl -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models
#   Gemini:     curl "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY"
#   OpenRouter: curl https://openrouter.ai/api/v1/models   (ids ending in :free)
# Model IDs below were verified on 2026-10-23.

model_list:
  # ---- Groq ----
  - model_name: groq-gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-qwen3-27b
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  # ---- Gemini ----
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # ---- OpenRouter (:free) ----
  - model_name: openrouter-gemma-4-31b
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-gemma-4-26b
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ---- Ollama ----
  - model_name: ollama-qwen2.5-7b
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: ollama-mistral-7b
    litellm_params:
      model: ollama_chat/mistral:7b
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: ollama-nomic-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE

  # ---- Gemini embeddings (free tier) ----
  - model_name: gemini-embedding
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
      dimensions: 768

router_settings:
  num_retries: 0
  timeout: 120

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
