# AI Gateway routing table.
#
# deployments: one model on one provider. The key must equal a `model_name` in
#              infra/litellm/config.yaml. `requires_env` skips the deployment when
#              that API key is unset, so the platform works with zero keys (Ollama only).
#              `rpm` is the free-tier requests-per-minute; the gateway stops sending
#              to a deployment once its budget for the minute is spent.
# aliases:     what callers ask for. Deployments are tried in order; on failure,
#              rate limit, missing key or an open circuit breaker, the next one is used.
#
# Free-tier model IDs change often; see infra/litellm/config.yaml for how to list them.

deployments:
  # ---- Groq (free tier) ----
  groq-gpt-oss-20b:
    provider: groq
    rpm: 30
    context_window: 131072
    requires_env: GROQ_API_KEY
  groq-gpt-oss-120b:
    provider: groq
    rpm: 30
    context_window: 131072
    requires_env: GROQ_API_KEY
  groq-qwen3-27b:
    provider: groq
    rpm: 30
    context_window: 131072
    requires_env: GROQ_API_KEY

  # ---- Google Gemini (free tier) ----
  gemini-flash:
    provider: gemini
    rpm: 10
    context_window: 1048576
    requires_env: GEMINI_API_KEY
  gemini-flash-lite:
    provider: gemini
    rpm: 15
    context_window: 1048576
    requires_env: GEMINI_API_KEY

  # ---- OpenRouter (:free models) ----
  openrouter-gemma-4-31b:
    provider: openrouter
    rpm: 20
    context_window: 131072
    requires_env: OPENROUTER_API_KEY
  openrouter-gemma-4-26b:
    provider: openrouter
    rpm: 20
    context_window: 131072
    requires_env: OPENROUTER_API_KEY

  # ---- Ollama (local, no key, no rate limit) ----
  ollama-qwen2.5-7b:
    provider: ollama
    context_window: 32768
  ollama-mistral-7b:
    provider: ollama
    context_window: 32768
  ollama-nomic-embed:
    provider: ollama
    kind: embedding

  # ---- Gemini embeddings (free tier) ----
  gemini-embedding:
    provider: gemini
    kind: embedding
    rpm: 100
    requires_env: GEMINI_API_KEY

aliases:
  chat-fast:
    description: Low-latency general chat
    deployments: [groq-gpt-oss-20b, gemini-flash-lite, openrouter-gemma-4-26b, ollama-qwen2.5-7b]
  chat-smart:
    description: Harder questions, longer context
    deployments: [gemini-flash, groq-gpt-oss-120b, groq-qwen3-27b, openrouter-gemma-4-31b, ollama-qwen2.5-7b]
  extract:
    description: Metadata / entity extraction (JSON)
    deployments: [ollama-qwen2.5-7b, gemini-flash-lite, groq-gpt-oss-20b]
  summarize:
    description: History compression
    deployments: [ollama-qwen2.5-7b, groq-gpt-oss-20b, gemini-flash-lite]
  judge:
    # Different model families from the chat answerers where possible, to reduce self-bias.
    description: LLM-as-judge for evaluations
    deployments: [groq-qwen3-27b, openrouter-gemma-4-31b, ollama-mistral-7b]
  embed:
    # All deployments of an embedding alias must produce the same vector size.
    kind: embedding
    description: Text embeddings (768-d)
    deployments: [ollama-nomic-embed]
  embed-gemini:
    # A separate alias, not a fallback of `embed`: vectors from different models
    # aren't comparable. Select it with EMBED_ALIAS=embed-gemini plus its own
    # EMBED_MODEL_NAME (Qdrant collection), and empty EMBED_*_PREFIX values.
    kind: embedding
    description: Gemini text embeddings (768-d)
    deployments: [gemini-embedding]
