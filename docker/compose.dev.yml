# Dev overrides: hot reload with bind-mounted source.
#
#   docker compose -f docker/compose.yml -f docker/compose.ports.yml -f docker/compose.dev.yml up

x-python-dev: &python-dev
  WATCHFILES_FORCE_POLLING: "true"   # reliable reload on Windows/macOS bind mounts
  DEBUG: "true"

services:
  backend:
    build:
      target: dev
    image: ai-platform-backend-dev
    environment: *python-dev
    volumes:
      - ../apps/backend/services:/app/services
      - ../apps/backend/libs:/app/libs

  gateway:
    build:
      target: dev
    image: ai-platform-gateway-dev
    environment: *python-dev
    volumes:
      - ../apps/backend/services:/app/services
      - ../apps/backend/libs:/app/libs

  migrate:
    build:
      target: dev
    image: ai-platform-backend-dev
    command: ["alembic", "-c", "/app/libs/db/alembic.ini", "upgrade", "head"]

  frontend:
    build:
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
      - /app/.next
